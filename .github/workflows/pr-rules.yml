name: pr-rules

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read

jobs:
  conventions:
    name: conventions
    runs-on: ubuntu-latest
    steps:
      - name: Validar título do PR
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            test
            ci
            style
            perf
            build
            revert
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validar mensagens de commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          while IFS= read -r subject; do
            if ! printf '%s\n' "$subject" | grep -Eq '^(feat|fix|docs|chore|refactor|test|ci|style|perf|build|revert)(\([a-z0-9-]+\))?: .+'; then
              echo "Commit fora do padrão Conventional Commits: $subject"
              fail=1
            fi
          done < <(git log --no-merges --format=%s "$BASE_SHA..$HEAD_SHA")
          exit $fail

  issue-link:
    name: issue-link
    runs-on: ubuntu-latest
    steps:
      - name: Exigir Closes #N no corpo do PR
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          case ",$LABELS," in *,sem-issue,*) exit 0;; esac
          printf '%s' "$PR_BODY" | grep -Eiq '(closes|fixes|resolves) #[0-9]+' \
            || { echo "O corpo do PR precisa de 'Closes #N' (ou o label sem-issue)."; exit 1; }
