name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint · Testes
    # macos-26 traz Xcode 26 (Swift 6.2), exigido pelo SwiftTerm a partir da slice 4.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Gerar projeto
        run: brew install xcodegen && xcodegen generate

      # O SwiftTerm compila shaders Metal; o Xcode 26 traz o compilador como componente à parte.
      - name: Metal Toolchain
        run: xcodebuild -showComponent MetalToolchain | grep -q "Status: installed" || xcodebuild -downloadComponent MetalToolchain

      - name: Lint
        run: swift format lint --strict --recursive DevPorts DevPortsTests

      - name: Testes
        run: xcodebuild -quiet test -project DevPorts.xcodeproj -scheme DevPorts -destination 'platform=macOS,arch=arm64' -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO
