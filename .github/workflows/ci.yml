name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint · Build
    # macos-26 traz Xcode 26 (Swift 6.2), exigido pelo SwiftTerm a partir da slice 4.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Gerar projeto
        run: brew install xcodegen && xcodegen generate

      - name: Lint
        run: swift format lint --strict --recursive DevPorts

      # Vira `xcodebuild test` na slice 1, junto com o target DevPortsTests.
      - name: Build
        run: xcodebuild -quiet build -project DevPorts.xcodeproj -scheme DevPorts -destination 'platform=macOS,arch=arm64' CODE_SIGNING_ALLOWED=NO
