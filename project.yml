name: DevPorts
options:
  bundleIdPrefix: com.lucasstopinski
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16"
  generateEmptyDirectories: true
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES

targets:
  DevPorts:
    type: application
    platform: macOS
    sources:
      - path: DevPorts
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucasstopinski.DevPorts
        INFOPLIST_FILE: DevPorts/App/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
