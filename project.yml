name: DevPorts
options:
  bundleIdPrefix: com.lucasstopinski
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16"
  generateEmptyDirectories: true
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.20.0

targets:
  DevPorts:
    type: application
    platform: macOS
    sources:
      - path: DevPorts
    dependencies:
      - package: SwiftTerm
    scheme:
      testTargets:
        - DevPortsTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucasstopinski.DevPorts
        INFOPLIST_FILE: DevPorts/App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: 69D4S5TF8S

  DevPortsTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: DevPortsTests
    dependencies:
      - target: DevPorts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucasstopinski.DevPortsTests
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: 69D4S5TF8S
